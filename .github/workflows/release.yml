# Builds LuffaHelper.zip (containing a folder named exactly "LuffaHelper")
# and attaches it to a GitHub release whenever a version tag like v1.2.0 is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir LuffaHelper
          cp LuffaHelper.lua Water_0.lua Water_1.lua LuffaHelper.toc README.txt LuffaHelper/
          zip -r LuffaHelper.zip LuffaHelper
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LuffaHelper.zip --title "LuffaHelper $GITHUB_REF_NAME" --generate-notes
